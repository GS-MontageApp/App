<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dr. Zange – Zangenschlosser App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="./img/icon-512.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .row-selected {
      outline: 2px solid #005691 !important;
      outline-offset: -2px;
      background-color: rgba(0, 86, 145, 0.12) !important;
    }
  </style>
</head>
<body class="h-full bg-slate-100 text-slate-800 flex flex-col overflow-hidden select-none">
  
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2.5">
      <img src="./img/icon-512.png" alt="Logo" class="w-8 h-8 rounded-lg object-cover">
      <div>
        <h1 class="text-xs font-black uppercase tracking-wider text-slate-900 leading-tight">Dr. Zange</h1>
        <p id="app-version-badge" class="text-[10px] text-slate-500 font-medium">v1.10.35 | MEZ Berlin</p>
      </div>
    </div>
    <button onclick="App.openLogbookModal('master')" class="p-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-bold transition-all">Logbuch</button>
  </header>

  <main id="app-main-viewport" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
    <!-- View Container (gerendert via app.js) -->
    <div id="view-etagen" class="app-view hidden space-y-4"></div>
    <div id="view-zuschnitt" class="app-view hidden space-y-4"></div>
    <div id="view-drehwinkel" class="app-view hidden space-y-4"></div>
    <div id="view-eoform" class="app-view flex flex-col space-y-4 pb-4"></div>
  </main>

  <nav class="bg-white border-t border-slate-200 h-16 flex items-center justify-around shrink-0 z-30">
    <button onclick="App.switchView('etagen')" id="nav-btn-etagen" class="flex flex-col items-center justify-center flex-1 h-full text-slate-500 text-xs">Etagen</button>
    <button onclick="App.switchView('zuschnitt')" id="nav-btn-zuschnitt" class="flex flex-col items-center justify-center flex-1 h-full text-slate-500 text-xs">Zuschnitt</button>
    <button onclick="App.switchView('drehwinkel')" id="nav-btn-drehwinkel" class="flex flex-col items-center justify-center flex-1 h-full text-slate-500 text-xs">Winkel</button>
    <button onclick="App.switchView('eoform')" id="nav-btn-eoform" class="flex flex-col items-center justify-center flex-1 h-full text-indigo-600 font-bold text-xs">Tabellen</button>
  </nav>

  <!-- Logbook Modal -->
  <div id="logbook-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4 max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-900">Projekt-Logbuch</h3>
        <button onclick="App.closeLogbookModal()" class="text-slate-400 hover:text-slate-700 font-bold px-2 py-1">✕</button>
      </div>
      <div id="logbook-content" class="overflow-y-auto space-y-3 flex-1 text-xs"></div>
    </div>
  </div>

  <script src="./changelogs.js"></script>
  <script src="./app.js"></script>
</body>
</html>
