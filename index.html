<!-- BOOTSTRAPPER mit robuster Absicherung gegen Ladefehler -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      console.log("Bootstrapper: Prüfe APP_CONFIG...", window.APP_CONFIG);

      const verInfo = window.APP_CONFIG || { version: 'v1.10.59 (Fallback)', date: '13.09.2026' };

      const splashVer = document.getElementById('splash_version_text');
      if (splashVer) {
        splashVer.textContent = `${verInfo.version} | ${verInfo.date}`;
      }

      const menuSub = document.getElementById('menu_version_subtitle');
      if (menuSub) {
        menuSub.textContent = `${verInfo.version} — ${verInfo.date}`;
      }
      
      // Theme sofort beim Start laden
      if (window.setTheme) {
        const savedTheme = localStorage.getItem('zangenschlosser_theme_v1') || 'standard';
        window.setTheme(savedTheme);
      }

      if (typeof AppShell !== 'undefined') AppShell.init();
      if (window.EtagenApp) EtagenApp.init();
      if (window.ZuschnittApp) ZuschnittApp.init();
      if (window.DrehwinkelApp) DrehwinkelApp.init();
      if (window.TabellenApp) TabellenApp.init();
      if (window.DrehmomentApp) DrehmomentApp.init();
      
      if (typeof AppShell !== 'undefined' && AppShell.switchApp) {
        AppShell.switchApp('etagen', 'Etagenrechner');
      }
    });
  </script>
