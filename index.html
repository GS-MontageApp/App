<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <!-- === ZANGENSCHLOSSER APP - Version v1.12.1 === -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Anti-Cache Direktiven -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title id="page-title">Zangenschlosser App v1.12.1 (Dr. Zange)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css?v=v1.12.1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Globale Login-, Rollen- & Theme-Steuerung -->
  <script>
    window.openPinModal = function() {
      const topMenu = document.getElementById('top_menu_modal');
      if (topMenu) topMenu.classList.add('hidden');
      const pinModal = document.getElementById('pin_modal');
      const pinInput = document.getElementById('pin_input');
      if (pinModal) pinModal.classList.remove('hidden');
      if (pinInput) {
        pinInput.value = '';
        setTimeout(() => pinInput.focus(), 100);
      }
    };

    window.closePinModal = function() {
      const pinModal = document.getElementById('pin_modal');
      if (pinModal) pinModal.classList.add('hidden');
    };

    window.submitPinLogin = function() {
      const pinInput = document.getElementById('pin_input');
      const pin = pinInput ? pinInput.value.trim() : '';
      const headerEl = document.getElementById('main_header');
      const badgeEl = document.getElementById('role_status_badge');
      const logoutItem = document.getElementById('logout_menu_item');
      const rootSecZuschnitt = document.getElementById('root_section_zuschnitt');

      if (headerEl) {
        headerEl.classList.remove('role-header-root', 'role-header-user');
      }

      if (pin === '0633') {
        if (headerEl) headerEl.classList.add('role-header-root');
        if (badgeEl) {
          badgeEl.textContent = '~/root';
          badgeEl.className = 'badge-root';
          badgeEl.classList.remove('hidden');
        }
        if (logoutItem) logoutItem.classList.remove('hidden');
        if (rootSecZuschnitt) rootSecZuschnitt.classList.remove('hidden');
        localStorage.setItem('zangenschlosser_role', 'root');
        window.closePinModal();
      } else if (pin === '0449') {
        if (headerEl) headerEl.classList.add('role-header-user');
        if (badgeEl) {
          badgeEl.textContent = '~/benutzer';
          badgeEl.className = 'badge-user';
          badgeEl.classList.remove('hidden');
        }
        if (logoutItem) logoutItem.classList.remove('hidden');
        if (rootSecZuschnitt) rootSecZuschnitt.classList.add('hidden');
        localStorage.setItem('zangenschlosser_role', 'user');
        window.closePinModal();
      } else {
        alert('Ungültige PIN!');
        if (pinInput) {
          pinInput.value = '';
          pinInput.focus();
        }
      }
    };

    window.logoutRole = function() {
      const headerEl = document.getElementById('main_header');
      const badgeEl = document.getElementById('role_status_badge');
      const logoutItem = document.getElementById('logout_menu_item');
      const rootSecZuschnitt = document.getElementById('root_section_zuschnitt');

      if (headerEl) headerEl.classList.remove('role-header-root', 'role-header-user');
      if (badgeEl) {
        badgeEl.textContent = '';
        badgeEl.className = 'hidden';
      }
      if (logoutItem) logoutItem.classList.add('hidden');
      if (rootSecZuschnitt) rootSecZuschnitt.classList.add('hidden');
      localStorage.removeItem('zangenschlosser_role');
    };

    window.setTheme = function(themeName) {
      const body = document.body;
      if (!body) return;
      const btnStandard = document.getElementById('theme_btn_standard');
      const btnGs = document.getElementById('theme_btn_gs');
      if (themeName === 'gs') {
        body.classList.add('theme-gs');
        if (btnGs) btnGs.className = 'p-2.5 rounded-xl text-xs font-bold border-2 border-yellow-400 bg-slate-900 text-yellow-400 shadow-md transition-all text-center';
        if (btnStandard) btnStandard.className = 'p-2.5 rounded-xl text-xs font-bold border border-slate-600 bg-slate-800 text-slate-300 transition-all text-center';
      } else {
        body.classList.remove('theme-gs');
        if (btnStandard) btnStandard.className = 'p-2.5 rounded-xl text-xs font-bold border-2 border-indigo-600 bg-white text-indigo-700 shadow-md transition-all text-center';
        if (btnGs) btnGs.className = 'p-2.5 rounded-xl text-xs font-bold border border-slate-300 bg-slate-100 text-slate-700 transition-all text-center';
      }
      localStorage.setItem('zangenschlosser_theme_v1', themeName);
    };
  </script>

  <!-- Single Source of Truth Version Config & Modules -->
  <script src="js/version.js?v=v1.12.1"></script>
  <script src="js/zuschnitt.js?v=v1.12.1"></script>
  <script src="js/etagen.js?v=v1.12.1"></script>
  <script src="js/drehwinkel.js?v=v1.12.1"></script>
  <script src="js/tabellen.js?v=v1.12.1"></script>
  <script src="js/drehmoment.js?v=v1.12.1"></script>
  <script src="js/shell.js?v=v1.12.1"></script>
</head>
<body class="bg-slate-100 h-full text-slate-800 flex flex-col m-0 p-0 overflow-x-hidden">

  <!-- Header oben -->
  <header id="main_header" class="sticky top-0 bg-white/85 backdrop-blur-md border-b border-slate-200 z-30 px-3 py-1.5 shrink-0 transition-colors">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <h1 id="header-title" class="text-sm font-bold text-slate-800">Zuschnittsrechner (v1.12.1)</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="role_status_badge" class="hidden"></span>
        <button onclick="openTopMenu()" class="w-9 h-9 rounded-full hover:bg-slate-100 text-slate-600 transition-colors flex items-center justify-center text-lg" aria-label="Menü öffnen">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <!-- Hauptcontainer -->
  <main class="flex-1 max-w-3xl mx-auto w-full pt-1.5 pb-28 px-3 md:pt-3 md:pb-20 md:px-6 flex flex-col justify-start">
        
    <!-- MODUL 1: ETAGENRECHNER -->
    <div id="view-etagen" class="app-view hidden space-y-5 flex-1">
      <section class="bg-white p-5 rounded-2xl shadow-sm space-y-4 first:mt-0 transition-colors">
        <div class="space-y-1.5">
          <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">3D-Isometrie Modell</h2>
          <div class="w-full h-[260px] sm:h-[340px] bg-slate-50 rounded-xl border border-slate-200 overflow-hidden flex items-center justify-center shadow-inner">
            <svg id="etagen_svg_sketch" viewBox="0 0 1000 580" class="w-full h-full">
              <g id="etagen_gfx_container"></g>
            </svg>
          </div>
        </div>
      </section>
    </div>

    <!-- MODUL 2: ZUSCHNITTSRECHNER (Standard-Startansicht) -->
    <div id="view-zuschnitt" class="app-view space-y-4 flex-1 block">
      <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3 first:mt-0 transition-colors">
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider border-b pb-1.5">Globale Parameter (Pflichtfeld)</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Rohr-Ø (d)</label>
            <select id="zuschnitt_durchmesser" class="w-full bg-amber-50 border border-amber-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="" disabled selected>Rohr-Ø wählen...</option>
              <option value="6">6 mm</option><option value="8">8 mm</option><option value="10">10 mm</option><option value="12">12 mm</option><option value="15">15 mm</option><option value="16">16 mm</option><option value="18">18 mm</option><option value="20">20 mm</option><option value="22">22 mm</option><option value="25">25 mm</option><option value="28">28 mm</option><option value="30">30 mm</option><option value="35">35 mm</option><option value="38">38 mm</option><option value="42">42 mm</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Radius-Faktor</label>
            <select id="zuschnitt_rfaktor" class="w-full bg-amber-50 border border-amber-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="" disabled selected>Faktor wählen...</option>
              <option value="2">2</option><option value="3">3</option>
            </select>
          </div>
        </div>
      </section>

      <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3 transition-colors">
        <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider border-b pb-1.5">Schenkel und Bogen-Folge</h2>
        <div id="zuschnitt_chain_container" class="space-y-3">
          <div id="zuschnitt_base_group" class="flex items-stretch gap-2">
            <div class="flex-1 space-y-3">
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Schenkel 1 (Freies Maß)" data-type="schenkel" data-index="0" inputmode="decimal" disabled class="w-full bg-slate-200 border border-slate-300 rounded-lg p-2.5 text-base text-slate-400 cursor-not-allowed focus:outline-none transition-colors">
              </div>
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Biegewinkel 1" data-type="winkel" data-index="0" inputmode="decimal" min="1" max="180" disabled class="w-full bg-slate-200 border border-slate-300 rounded-lg p-2.5 text-base text-slate-400 cursor-not-allowed focus:outline-none transition-colors">
              </div>
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Schenkel 2 (Freies Maß)" data-type="schenkel" data-index="1" inputmode="decimal" disabled class="w-full bg-slate-200 border border-slate-300 rounded-lg p-2.5 text-base text-slate-400 cursor-not-allowed focus:outline-none transition-colors">
              </div>
            </div>
            <button type="button" tabindex="-1" id="zuschnitt_clear_base" title="Basis-Kette löschen" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold px-3.5 rounded-xl flex items-center justify-center transition-colors shadow-sm">
              <span class="text-xl">🗑️</span>
            </button>
          </div>

          <div id="zuschnitt_pair_1" class="hidden flex items-stretch gap-2">
            <div class="flex-1 space-y-3">
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Biegewinkel 2" data-type="winkel" data-index="1" inputmode="decimal" min="1" max="180" class="w-full bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-base focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-colors">
              </div>
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Schenkel 3 (Freies Maß)" data-type="schenkel" data-index="2" inputmode="decimal" class="w-full bg-sky-50 border border-sky-200 rounded-lg p-2.5 text-base focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-colors">
              </div>
            </div>
            <button type="button" tabindex="-1" id="zuschnitt_clear_1" title="Einheit löschen" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold px-3.5 rounded-xl flex items-center justify-center transition-colors shadow-sm">
              <span class="text-xl">🗑️</span>
            </button>
          </div>

          <div id="zuschnitt_pair_2" class="hidden flex items-stretch gap-2">
            <div class="flex-1 space-y-3">
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Biegewinkel 3" data-type="winkel" data-index="2" inputmode="decimal" min="1" max="180" class="w-full bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-base focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-colors">
              </div>
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Schenkel 4 (Freies Maß)" data-type="schenkel" data-index="3" inputmode="decimal" class="w-full bg-sky-50 border border-sky-200 rounded-lg p-2.5 text-base focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-colors">
              </div>
            </div>
            <button type="button" tabindex="-1" id="zuschnitt_clear_2" title="Einheit löschen" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold px-3.5 rounded-xl flex items-center justify-center transition-colors shadow-sm">
              <span class="text-xl">🗑️</span>
            </button>
          </div>

          <div id="zuschnitt_pair_3" class="hidden flex items-stretch gap-2">
            <div class="flex-1 space-y-3">
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Biegewinkel 4" data-type="winkel" data-index="3" inputmode="decimal" min="1" max="180" class="w-full bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-base focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-colors">
              </div>
              <div class="input-wrapper bg-slate-50 p-1.5 rounded-xl border border-slate-200">
                <input type="text" placeholder="Schenkel 5 (Freies Maß)" data-type="schenkel" data-index="4" inputmode="decimal" class="w-full bg-sky-50 border border-sky-200 rounded-lg p-2.5 text-base focus:bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none transition-colors">
              </div>
            </div>
            <button type="button" tabindex="-1" id="zuschnitt_clear_3" title="Einheit löschen" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold px-3.5 rounded-xl flex items-center justify-center transition-colors shadow-sm">
              <span class="text-xl">🗑️</span>
            </button>
          </div>
        </div>
      </section>

      <section class="bg-white p-5 rounded-2xl shadow-sm space-y-2 border-2 border-red-500 transition-colors">
        <h2 id="zuschnitt_out_titel" class="text-xs font-semibold text-red-600 uppercase tracking-wider border-b border-red-200 pb-1.5">Ergebnis &ndash; <i>Parameter wählen</i></h2>
        
        <div id="zuschnitt_out_gesamtlänge" class="p-3 bg-red-50 rounded-xl border-[2.5px] border-red-300 border-l-[12px] border-l-red-500 shadow-sm flex flex-col">
          <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Gesamtzuschnittlänge (Freie Schenkel + Bogenmaße)</span>
          <span id="zuschnitt_out_gesamtlänge_wert" class="text-2xl font-bold text-slate-700 mt-0.5">0 mm</span>
        </div>
      </section>

      <!-- GESCHÜTZTER ROOT-BEREICH MIT EXPORT-TABELLE -->
      <section id="root_section_zuschnitt" class="hidden bg-slate-900 text-amber-300 p-5 rounded-2xl shadow-sm border-2 border-amber-400 transition-colors space-y-3">
        <div class="border-b border-amber-500/30 pb-2 flex items-center justify-between">
          <span>~/root</span>
          <button type="button" id="zuschnitt_export_btn" title="Export-Tabelle anzeigen" class="bg-amber-400 hover:bg-amber-300 active:bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition-colors shadow-md text-xs">
            <span>📥</span><span>Exportieren</span>
          </button>
        </div>

        <!-- Dynamische Export-Tabelle (Standardmäßig versteckt) -->
        <div id="zuschnitt_export_container" class="hidden pt-2 overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse whitespace-nowrap text-amber-200">
            <thead>
              <tr class="border-b border-amber-500/40 text-amber-400 uppercase">
                <th class="py-2 px-2">Nocke</th>
                <th class="py-2 px-2">Millimeter</th>
                <th class="py-2 px-2">Travel</th>
                <th class="py-2 px-2">Verdrehwinkel</th>
                <th class="py-2 px-2">Biegewinkel soll</th>
                <th class="py-2 px-2">Biegewinkel ist</th>
              </tr>
            </thead>
            <tbody id="zuschnitt_export_tbody" class="divide-y divide-amber-500/20 font-mono">
              <!-- Wird dynamisch befüllt -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- MODUL 3 & 4 (Verdrehwinkel, Tabellen, etc.) -->
    <div id="view-drehwinkel" class="app-view hidden space-y-4 flex-1"></div>
    <div id="view-eoform" class="app-view hidden flex-col w-full flex-1"></div>
  </main>

  <!-- Footer Navigation -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 shadow-lg z-40 px-2 py-1 shrink-0 transition-colors">
    <div class="max-w-3xl mx-auto grid grid-cols-5 gap-1 text-center">
      <button onclick="switchApp('etagen', 'Etagenrechner')" id="nav-etagen" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400">
        <span class="text-lg">📐</span><span class="text-[10px] font-semibold truncate w-full">Etage</span>
      </button>
      <button onclick="switchApp('zuschnitt', 'Zuschnittsrechner')" id="nav-zuschnitt" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-yellow-400">
        <span class="text-lg">✂️</span><span class="text-[10px] font-semibold truncate w-full">Zuschnitt</span>
      </button>
      <button onclick="switchApp('drehwinkel', 'Verdrehwinkel')" id="nav-drehwinkel" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400">
        <span class="text-lg">🔄</span><span class="text-[10px] font-semibold truncate w-full">Verdrehwinkel</span>
      </button>
      <button onclick="switchAppWithTablesCheck('eoform', 'Tabellen')" id="nav-eoform" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400">
        <span class="text-lg">📋</span><span class="text-[10px] font-semibold truncate w-full">Tabellen</span>
      </button>
      <button onclick="openMehrModal()" id="nav-mehr" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400">
        <span class="text-lg">⋯</span><span class="text-[10px] font-semibold truncate w-full">Mehr</span>
      </button>
    </div>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.ZuschnittApp) ZuschnittApp.init();
      AppShell.switchApp('zuschnitt', 'Zuschnittsrechner');
    });
  </script>
</body>
</html>
