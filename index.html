<!-- ... vorheriger HTML-Code (Header, Main, Modals) bleibt exakt gleich, mit "v1.12.3" im Head ... -->
  <!-- Modals -->
  <div id="mehr_modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-0">
  <!-- ... Inhalt ... -->
  </div>

  <!-- Splash Screen mit tagesbasiertem LocalStorage-Schutz -->
  <div id="daily_splash_modal" class="hidden fixed inset-0 bg-black z-50 flex items-center justify-center p-0">
    <div onclick="closeDailySplash()" class="relative w-full h-full max-w-lg max-h-screen bg-slate-950 flex items-center justify-center overflow-hidden cursor-pointer group">
      <img src="./img/dr-zange.jpg" alt="Dr. Zange Willkommen" class="w-full h-full object-contain select-none pointer-events-none">
      <button onclick="event.stopPropagation(); closeDailySplash()" class="absolute top-6 right-6 bg-black/70 hover:bg-black text-white font-bold rounded-full w-12 h-12 flex items-center justify-center text-xl transition-colors shadow-2xl border-2 border-white/20 z-40" aria-label="Schließen">&times;</button>
      <div id="splash_version_text" class="absolute bottom-0 right-0 bg-black/90 backdrop-blur-md text-white/95 text-[11px] font-mono px-3.5 py-1.5 rounded-tl-lg border-l border-t border-white/25 pointer-events-none z-30 shadow-xl">
        Lade Version...
      </div>
    </div>
  </div>

  <!-- ... Restliche Modals (Top-Menu, Pin, Sub-Modal) ... -->

  <script>
    function openZoomModal(imgSrc, title) {
      const modal = document.getElementById('zoom_modal');
      const img = document.getElementById('zoom_modal_img');
      const titleEl = document.getElementById('zoom_modal_title');
      if (img) img.src = imgSrc;
      if (titleEl) titleEl.textContent = title || 'Skizzen-Ansicht';
      if (modal) modal.classList.remove('hidden');
    }

    function closeZoomModal() {
      const modal = document.getElementById('zoom_modal');
      if (modal) modal.classList.add('hidden');
    }

    function switchAppWithTablesCheck(viewId, title) {
      if (window.switchApp) {
        window.switchApp(viewId, title);
      }
      if (viewId === 'eoform') {
        if (window.TabellenApp) TabellenApp.init();
        if (window.DrehmomentApp) DrehmomentApp.init();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const splashVer = document.getElementById('splash_version_text');
      if (splashVer && window.APP_CONFIG) {
        splashVer.textContent = `${window.APP_CONFIG.version} | ${window.APP_CONFIG.date}`;
      }
      const menuSub = document.getElementById('menu_version_subtitle');
      if (menuSub && window.APP_CONFIG) {
        menuSub.textContent = `${window.APP_CONFIG.version} — ${window.APP_CONFIG.date}`;
      }

      const savedRole = localStorage.getItem('zangenschlosser_role');
      const headerEl = document.getElementById('main_header');
      const badgeEl = document.getElementById('role_status_badge');
      const logoutItem = document.getElementById('logout_menu_item');
      const cutbackRootSection = document.getElementById('zuschnitt_root_cutback_section');
      
      if (savedRole === 'root' && headerEl && badgeEl) {
        headerEl.classList.add('role-header-root');
        badgeEl.textContent = '~/root';
        badgeEl.className = 'badge-root';
        badgeEl.classList.remove('hidden');
        if (logoutItem) logoutItem.classList.remove('hidden');
        if (cutbackRootSection) cutbackRootSection.classList.remove('hidden');
      } else if (savedRole === 'user' && headerEl && badgeEl) {
        headerEl.classList.add('role-header-user');
        badgeEl.textContent = '~/benutzer';
        badgeEl.className = 'badge-user';
        badgeEl.classList.remove('hidden');
        if (logoutItem) logoutItem.classList.remove('hidden');
        if (cutbackRootSection) cutbackRootSection.classList.add('hidden');
      }

      if (window.setTheme) {
        const savedTheme = localStorage.getItem('zangenschlosser_theme_v1') || 'gs';
        window.setTheme(savedTheme);
      }

      // HIER WURDE DER REDUNDANTE AUFRUF ENTFERNT.
      // Die AppShell initialisiert den Splash-Screen nun zentral.
      AppShell.init(); 

      if (window.EtagenApp) EtagenApp.init();
      if (window.ZuschnittApp) ZuschnittApp.init();
      if (window.DrehwinkelApp) DrehwinkelApp.init();
      
      setTimeout(() => {
        if (window.TabellenApp) TabellenApp.init();
        if (window.DrehmomentApp) DrehmomentApp.init();
      }, 100);

      AppShell.switchApp('zuschnitt', 'Zuschnittsrechner');
    });
  </script>
</body>
</html>
